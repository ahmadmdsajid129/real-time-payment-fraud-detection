global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'fraud-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']

  - job_name: 'feature-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['feature_service:9100']

  - job_name: 'inference-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['inference_service:9101']

  - job_name: 'risk-engine'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['risk_engine:9102']
