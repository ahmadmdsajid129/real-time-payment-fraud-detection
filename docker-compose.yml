version: '3.8'

networks:
  fraud-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  prometheus_data:
  grafana_data:

services:
  # ============================================================================
  # 1. Backing Infrastructure
  # ============================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fraud-zookeeper
    networks:
      - fraud-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fraud-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - fraud-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fraud-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fraud-net
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      # Block until Kafka broker is reachable
      kafka-topics --bootstrap-server kafka:29092 --list

      echo 'Provisioning Kafka Topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions.raw --replication-factor 1 --partitions 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions.features --replication-factor 1 --partitions 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions.predictions --replication-factor 1 --partitions 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions.decisions --replication-factor 1 --partitions 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions.feedback --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions.dlq --replication-factor 1 --partitions 1

      echo 'Kafka Topics successfully initialized!'
      "

  redis:
    image: redis:7.2-alpine
    container_name: fraud-redis
    networks:
      - fraud-net
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: fraud-postgres
    networks:
      - fraud-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: fraud_engine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fraud_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Observability Subsystem
  # ============================================================================

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: fraud-prometheus
    networks:
      - fraud-net
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.2.0
    container_name: fraud-grafana
    depends_on:
      - prometheus
    networks:
      - fraud-net
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # 3. Application Services & Streaming Workers
  # ============================================================================

  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - fraud-net
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres_dev_password@postgres:5432/fraud_engine
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  feature-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-feature-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fraud-net
    command: ["python", "services/feature_service/consumer.py"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  inference-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-inference-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fraud-net
    command: ["python", "services/inference_service/consumer.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  risk-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-risk-engine
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fraud-net
    command: ["python", "services/risk_engine/consumer.py"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres_dev_password@postgres:5432/fraud_engine
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  transaction-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-generator
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fraud-net
    command: ["python", "services/transaction_generator/producer.py", "--count", "500", "--rate", "2.0"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
